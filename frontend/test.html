<!DOCTYPE html>
<html>
<head><title>WMS Test</title></head>
<body style="background:#111;color:#0f0;padding:40px;font-family:monospace">
<h1 style="color:#0ff">WMS Frontend Test</h1>
<div id="r"></div>
<script>
var r = document.getElementById('r');
r.innerHTML += '<p style="color:#0f0">✅ HTML is working</p>';
r.innerHTML += '<p>API_BASE = ' + (window.API_BASE || 'NOT SET') + '</p>';
r.innerHTML += '<p>Location = ' + window.location.href + '</p>';

fetch((window.API_BASE || 'http://localhost:5000/api') + '/health')
  .then(function(res) { return res.json(); })
  .then(function(d) {
    r.innerHTML += '<p style="color:#0f0">✅ Backend connected: ' + d.status + '</p>';
  })
  .catch(function(e) {
    r.innerHTML += '<p style="color:#f00">❌ Backend error: ' + e.message + '</p>';
    r.innerHTML += '<p style="color:#ff0">→ Start backend: cd backend && npm start</p>';
  });
</script>
</body>
</html>
